name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  lint_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web4all/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web4all

      - name: Lint
        run: npm run lint
        working-directory: web4all

      - name: Build
        run: npm run build
        working-directory: web4all
